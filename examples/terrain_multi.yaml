# 项目书默认多地形分区仿真场景
# 三条测试带：沙土/泥沙路面、水泥/硬化路面、冰雪路面

world_name: "snowplow_multi_terrain"

ground_size: 30.0

# 不指定 terrain_zones 时，world_generator.py 自动使用三地形默认分区：
#   sand     x=-10, y=0, width=10, depth=24
#   concrete x=0,   y=0, width=10, depth=24
#   snow     x=10,  y=0, width=10, depth=24
#
# 如果需要自定义布局，取消注释下面内容：
# terrain_zones:
#   - {type: sand,     x: -10, y: 0, width: 10, depth: 24, thickness: 0.02}
#   - {type: concrete, x: 0,   y: 0, width: 10, depth: 24, thickness: 0.015}
#   - {type: snow,     x: 10,  y: 0, width: 10, depth: 24, thickness: 0.02}

slope:
  enabled: true
  x: 0
  y: 10
  width: 4.0
  depth: 8.0
  angle_deg: 10
  terrain_type: concrete

visual_detail:
  enabled: true
  tiles: 5
  edge_band: 0.18
